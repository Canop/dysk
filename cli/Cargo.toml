[package]
name = "dysk-cli"
version = "3.6.1"
authors = ["dystroy <denys.seguret@gmail.com>"]
edition = "2024"
license = "MIT"
description = "the dysk cli as a library"
homepage = "https://dystroy.org/dysk"
rust-version = "1.85"

[dependencies]
bet = "1.0.4"
clap = { version = "4.6", features = ["derive", "cargo"] }
